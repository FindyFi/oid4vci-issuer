name: Build and push image

# Builds and pushes to the "dev" account's ECR repo only - that repo then
# fans out to staging/prod via ECR replication (see
# aws-environment/tf/infrastructure/ecr/development-values.tfvars). Deploying
# a newly-pushed tag still needs the oid4vci_issuer_image value in the
# relevant aws-environment */*-values.tfvars updated and applied - this
# workflow does not do that itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: oid4vci-issuer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ***REMOVED***
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
